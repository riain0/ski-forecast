# Render Blueprint: https://render.com/docs/blueprint-spec
# The service keeps its original name so syncing this blueprint updates the existing service.
services:
  - type: web
    name: ikon-snow
    runtime: node
    plan: free # "starter" avoids the cold start after 15 min idle
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: CONTACT_EMAIL # optional: identifies the app to api.weather.gov
        sync: false
      - key: OPEN_METEO_API_KEY # optional: paid key, removes shared-IP rate limits entirely
        sync: false
